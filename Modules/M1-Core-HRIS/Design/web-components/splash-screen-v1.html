<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B1437" />
<title>Praxion — Loading your workspace</title>
<meta name="description" content="Praxion HROS splash screen" />

<!-- Preload web fonts: Inter (display) + DM Sans (body) per Praxion brand v2.0 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=DM+Sans:wght@400;500&display=swap"
  rel="stylesheet"
/>

<style>
  /* ---------------------------------------------------------------
     Praxion HROS — Splash / Loading Screen v1
     Brand: Praxion v2.0  •  Logo: praxion-icon-inverse (3D cube)
     Tokens: Navy #0B1437 · Signal #2F6BFF · Ion #19D3C5 · Amber #F59E0B
  --------------------------------------------------------------- */

  :root {
    /* Brand */
    --navy:        #0B1437;
    --navy-deep:   #060B22;   /* darker for vignette */
    --navy-lift:   #122055;   /* slightly lifted for radial */
    --signal:      #2F6BFF;
    --ion:         #19D3C5;
    --amber:       #F59E0B;
    --white:       #FFFFFF;
    --mist:        #E5E8EF;
    --slate:       #6B7280;

    /* Type */
    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-body:    'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    /* Motion */
    --ease-out:    cubic-bezier(0.16, 1, 0.3, 1);
    --ease-soft:   cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--navy-deep);
    font-family: var(--font-body);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ============== Splash root ============== */
  .splash {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, var(--navy-lift) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    z-index: 9999;
    opacity: 1;
    transition: opacity 600ms var(--ease-out);
  }
  .splash.is-leaving { opacity: 0; pointer-events: none; }

  /* Subtle ambient grid (very low contrast) */
  .splash::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, black 30%, transparent 70%);
    pointer-events: none;
  }

  /* ============== Stage (logo + text) ============== */
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 0 24px;
    text-align: center;
  }

  /* ---- Logo ---- */
  .logo {
    position: relative;
    width: clamp(140px, 18vmin, 196px);
    height: clamp(140px, 18vmin, 196px);
    display: grid;
    place-items: center;
    animation: floatY 4.8s var(--ease-soft) infinite;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  /* Soft glow halo behind the cube */
  .logo::before {
    content: "";
    position: absolute;
    inset: -20%;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 45%, rgba(47,107,255,0.22) 0%, rgba(25,211,197,0.10) 40%, transparent 70%);
    filter: blur(18px);
    animation: haloPulse 3.2s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.95; transform: scale(1.08); }
  }

  .logo svg {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;
    /* Soft drop shadow lifts the mark off the navy */
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }

  /* Shimmer sweep across the cube faces (clipped to the SVG bounds) */
  .logo::after {
    content: "";
    position: absolute;
    inset: 12% 12% 16% 12%;
    background: linear-gradient(
      115deg,
      transparent 30%,
      rgba(255,255,255,0.10) 48%,
      rgba(255,255,255,0.20) 50%,
      rgba(255,255,255,0.10) 52%,
      transparent 70%
    );
    transform: translateX(-120%);
    mix-blend-mode: screen;
    animation: shimmer 3.6s var(--ease-out) infinite;
    pointer-events: none;
    border-radius: 12%;
    z-index: 2;
  }
  @keyframes shimmer {
    0%   { transform: translateX(-120%); }
    60%  { transform: translateX(120%); }
    100% { transform: translateX(120%); }
  }

  /* ---- Animated dots inside SVG: pulse the three brand-color dots in sequence ---- */
  .dot-blue,
  .dot-teal,
  .dot-amber {
    transform-box: fill-box;
    transform-origin: center;
    animation: dotPulse 2.4s ease-in-out infinite;
  }
  .dot-blue  { animation-delay: 0s; }
  .dot-teal  { animation-delay: 0.4s; }
  .dot-amber { animation-delay: 0.8s; }

  @keyframes dotPulse {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.18); filter: brightness(1.35); }
  }

  /* ---- Wordmark ---- */
  .wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(28px, 3.6vmin, 40px);
    letter-spacing: -0.02em;
    color: var(--white);
    line-height: 1;
    margin-top: 4px;
    opacity: 0;
    animation: fadeUp 700ms var(--ease-out) 200ms forwards;
  }
  .wordmark .dot-accent {
    display: inline-block;
    width: 0.28em;
    height: 0.28em;
    margin-left: 0.12em;
    border-radius: 50%;
    background: var(--ion);
    transform: translateY(-0.05em);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---- Tagline ---- */
  .tagline {
    font-family: var(--font-body);
    font-size: clamp(11px, 1.3vmin, 13px);
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.55);
    opacity: 0;
    animation: fadeUp 700ms var(--ease-out) 360ms forwards;
  }

  /* ---- Loading status (rotating messages) ---- */
  .status {
    margin-top: 10px;
    min-height: 22px;
    font-family: var(--font-body);
    font-size: clamp(13px, 1.5vmin, 15px);
    color: rgba(255, 255, 255, 0.78);
    opacity: 0;
    animation: fadeUp 700ms var(--ease-out) 520ms forwards;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .status .spinner-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ion);
    box-shadow: 0 0 12px rgba(25,211,197,0.7);
    animation: tick 1.1s ease-in-out infinite;
  }
  @keyframes tick {
    0%, 100% { opacity: 0.4; transform: scale(0.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  .status-text {
    transition: opacity 320ms var(--ease-out), transform 320ms var(--ease-out);
  }
  .status-text.is-swapping {
    opacity: 0;
    transform: translateY(4px);
  }

  /* ---- Progress bar ---- */
  .progress {
    position: relative;
    width: clamp(180px, 22vmin, 260px);
    height: 2px;
    margin-top: 18px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 700ms var(--ease-out) 680ms forwards;
  }
  .progress-bar {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, var(--signal), var(--ion));
    border-radius: 99px;
    transition: width 420ms var(--ease-out);
    box-shadow: 0 0 14px rgba(47,107,255,0.55);
  }
  /* Indeterminate sheen riding the bar */
  .progress::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    animation: sheen 1.6s linear infinite;
    mix-blend-mode: screen;
  }
  @keyframes sheen {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---- Footer (version) ---- */
  .footer {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.32);
    font-family: var(--font-body);
  }

  /* ============== Reduced motion ============== */
  @media (prefers-reduced-motion: reduce) {
    .logo,
    .logo::before,
    .logo::after,
    .dot-blue, .dot-teal, .dot-amber,
    .status .spinner-dot,
    .progress::after {
      animation: none !important;
    }
    .wordmark, .tagline, .status, .progress {
      opacity: 1;
      animation: none !important;
    }
  }

  /* Light-mode preference still uses the brand navy — splash stays consistent */
</style>
</head>
<body>

<div id="splash" class="splash" role="status" aria-live="polite" aria-label="Loading Praxion">

  <div class="stage">

    <!-- Praxion 3D cube mark (inlined SVG so we can animate the dots).
         Source: /Brand/logos/v2-production/svg/praxion-icon-inverse.svg
         Background rect from the source SVG removed; splash background does the navy. -->
    <div class="logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
        <!-- Ground shadow stack -->
        <ellipse cx="48" cy="80" rx="28" ry="4.5" fill="#000" fill-opacity="0.22"/>
        <ellipse cx="48" cy="80" rx="22" ry="3.4" fill="#000" fill-opacity="0.35"/>
        <ellipse cx="48" cy="80" rx="16" ry="2.4" fill="#000" fill-opacity="0.50"/>

        <!-- Cube faces -->
        <path d="M 48 16 L 76 30 L 48 44 L 20 30 Z" fill="#2D3A66"/>
        <path d="M 20 30 L 48 44 L 48 72 L 20 58 Z" fill="#1A2348"/>
        <path d="M 76 30 L 76 58 L 48 72 L 48 44 Z" fill="#1B4E55"/>

        <!-- Outer wireframe edges -->
        <g fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 48 16 L 76 30 L 76 58 L 48 72 L 20 58 L 20 30 Z" />
          <path d="M 48 16 L 48 44" />
          <path d="M 20 30 L 48 44" />
          <path d="M 76 30 L 48 44" />
        </g>

        <!-- Interior edges (lower contrast) -->
        <g fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 48 44 L 48 72" />
          <path d="M 48 44 L 20 58" />
          <path d="M 48 44 L 76 58" />
        </g>

        <!-- Brand-color dots (animated via CSS classes) -->
        <circle class="dot-blue"  cx="48" cy="16" r="4.4" fill="#2F6BFF"/>
        <circle                   cx="76" cy="30" r="4.4" fill="#FFFFFF"/>
        <circle class="dot-teal"  cx="76" cy="58" r="4.4" fill="#19D3C5"/>
        <circle                   cx="48" cy="72" r="4.4" fill="#FFFFFF"/>
        <circle class="dot-amber" cx="20" cy="58" r="4.4" fill="#F59E0B"/>
        <circle                   cx="20" cy="30" r="4.4" fill="#FFFFFF"/>
        <!-- Center hub -->
        <circle                   cx="48" cy="44" r="5.4" fill="#FFFFFF"/>
      </svg>
    </div>

    <!-- Wordmark + tagline -->
    <div>
      <div class="wordmark">Praxion<span class="dot-accent" aria-hidden="true"></span></div>
      <div class="tagline">Human Resource Operating System</div>
    </div>

    <!-- Loading status -->
    <div class="status" aria-live="polite">
      <span class="spinner-dot" aria-hidden="true"></span>
      <span id="statusText" class="status-text">Initializing your workspace…</span>
    </div>

    <!-- Progress bar -->
    <div class="progress" aria-hidden="true">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </div>

  <div class="footer">v1.0.0 &middot; Praxion HROS</div>
</div>

<script>
  /* ----------------------------------------------------------------
     Splash controller
     - Cycles status messages
     - Drives a soft "indeterminate-feeling" determinate progress bar
       that approaches 100% on PraxionSplash.complete()
     - Public API:
         window.PraxionSplash.update(percent, message)  // optional
         window.PraxionSplash.complete()                // dismiss
     - Auto-dismisses after 'window.load' + min display time, OR after
       a max timeout — whichever fits the host context.
  ---------------------------------------------------------------- */
  (function () {
    const splash       = document.getElementById('splash');
    const statusEl     = document.getElementById('statusText');
    const progressBar  = document.getElementById('progressBar');

    const MESSAGES = [
      'Initializing your workspace…',
      'Loading your modules…',
      'Securing your session…',
      'Almost ready…'
    ];

    const MIN_DISPLAY_MS = 1600;   // never flash; respect brand presence
    const MAX_DISPLAY_MS = 8000;   // hard cap so the user is never stuck
    const startedAt      = performance.now();

    let messageIndex   = 0;
    let currentPercent = 6;
    let dismissed      = false;

    progressBar.style.width = currentPercent + '%';

    // Rotate the status message every ~1.6s
    const messageTimer = setInterval(() => {
      messageIndex = (messageIndex + 1) % MESSAGES.length;
      statusEl.classList.add('is-swapping');
      setTimeout(() => {
        statusEl.textContent = MESSAGES[messageIndex];
        statusEl.classList.remove('is-swapping');
      }, 240);
    }, 1600);

    // Soft-creep the progress bar toward ~85% (the rest is unlocked on complete)
    const creepTimer = setInterval(() => {
      if (currentPercent < 85) {
        const gap  = 85 - currentPercent;
        const step = Math.max(0.6, gap * 0.06);
        currentPercent = Math.min(85, currentPercent + step);
        progressBar.style.width = currentPercent + '%';
      }
    }, 220);

    function dismiss() {
      if (dismissed) return;
      dismissed = true;
      clearInterval(messageTimer);
      clearInterval(creepTimer);

      // Snap to 100% then fade out
      currentPercent = 100;
      progressBar.style.width = '100%';

      setTimeout(() => {
        splash.classList.add('is-leaving');
        setTimeout(() => {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          window.dispatchEvent(new CustomEvent('praxion-splash:dismissed'));
        }, 650);
      }, 240);
    }

    function scheduleDismiss() {
      const elapsed   = performance.now() - startedAt;
      const remaining = Math.max(0, MIN_DISPLAY_MS - elapsed);
      setTimeout(dismiss, remaining);
    }

    // Public API for the host app
    window.PraxionSplash = {
      update(percent, message) {
        if (typeof percent === 'number') {
          currentPercent = Math.max(currentPercent, Math.min(99, percent));
          progressBar.style.width = currentPercent + '%';
        }
        if (typeof message === 'string' && message.length) {
          statusEl.classList.add('is-swapping');
          setTimeout(() => {
            statusEl.textContent = message;
            statusEl.classList.remove('is-swapping');
          }, 240);
        }
      },
      complete: scheduleDismiss
    };

    // Auto-dismiss when the page (or host) reports ready
    if (document.readyState === 'complete') {
      scheduleDismiss();
    } else {
      window.addEventListener('load', scheduleDismiss);
    }
    // Hard safety net
    setTimeout(dismiss, MAX_DISPLAY_MS);
  })();
</script>

</body>
</html>
